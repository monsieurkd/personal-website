# Continuous Integration: runs on every pull request and every push to main.
# If any step fails, the PR shows a red ✗ and (once you enable branch protection)
# cannot be merged. This is the gate that makes merges safe.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (strict, from lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Validate the Docker image builds too. This is the "complete spec"
      # check: the container bundles OS + Node + deps + code, and CI rebuilds
      # it from scratch on every PR so a Dockerfile break is caught at the gate.
      # Docker is preinstalled on GitHub-hosted Ubuntu runners.
      - name: Build Docker image
        run: docker build -t personal-website:ci .
